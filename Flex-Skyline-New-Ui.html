<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Rackspace Cloud | FLEX Region DR Creation</title>
  <style>
    :root {
      --topbar: #ffffff;
      --sidebar: #ffffff;
      --page: #f6f8fc;
      --panel: #ffffff;
      --line: #e6e9ee;
      --line-strong: #d6dbe3;
      --text: #111827;
      --muted: #687385;
      --red: #b13a3d;
      --red-dark: #9f3033;
      --green: #2b9b63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    .topbar {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      display: flex;
      align-items: center;
      background: var(--topbar);
      color: #1f2937;
      border-bottom: 1px solid var(--line);
      box-shadow: 0 1px 3px rgba(15,23,42,.08);
    }
    .hamburger {
      width: 43px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #f8fafc;
      border-right: 1px solid var(--line);
      font-size: 24px;
      line-height: 1;
    }
    .brand {
      width: 140px;
      text-align: center;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -.5px;
    }
    .brand small {
      display: block;
      margin-top: -5px;
      font-size: 7px;
      font-style: normal;
      letter-spacing: .2px;
      opacity: .9;
    }
    .project {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 100%;
      padding: 0 18px;
      border-left: 1px solid var(--line);
      color: #334155;
      white-space: nowrap;
    }
    .grid-icon { color: #64748b; font-size: 15px; }
    .domain {
      margin-left: 8px;
      padding-left: 22px;
      border-left: 1px solid var(--line-strong);
      font-weight: 600;
    }
    .profile {
      margin-left: auto;
      margin-right: 16px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #f1f5f9;
      color: #20242c;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
    }
    .sidebar {
      position: fixed;
      z-index: 20;
      top: 42px;
      bottom: 0;
      left: 0;
      width: 212px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .nav-item {
      height: 47px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #1f2937;
      text-decoration: none;
      border-left: 3px solid transparent;
      white-space: nowrap;
    }
    .nav-item.section {
      font-weight: 500;
      justify-content: space-between;
    }
    .nav-item.active {
      background: #f2f4f7;
      border-left-color: var(--red);
      color: #111827;
    }
    .nav-child {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 40px;
      color: #344054;
      text-decoration: none;
      font-size: 13px;
    }
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c9ced6;
    }
    .nav-child.active .nav-dot { background: var(--red); }
    .main {
      position: fixed;
      top: 42px;
      left: 212px;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background: var(--page);
    }
    .breadcrumb {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line);
      color: #7a8494;
    }
    .breadcrumb strong { color: #111827; font-weight: 500; }
    .toolbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 28px;
      background: #eef1f5;
      border-bottom: 1px solid var(--line);
    }
    .btn {
      border: 0;
      border-radius: 4px;
      height: 33px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-red {
      background: var(--red);
      color: #fff;
    }
    .btn-red:hover { background: var(--red-dark); }
    .btn-disabled {
      background: #fff;
      color: #b9c0ca;
      border: 1px solid var(--line);
      cursor: default;
    }
    .btn-dr {
      background: #fff;
      color: #111827;
      margin-left: 0;
      box-shadow: 0 10px 22px rgba(37,99,235,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: auto;
      min-height: 0;
      padding: 0;
      line-height: 1.1;
      border: 1px solid #dbeafe;
      overflow: hidden;
    }
    .btn-dr:hover {
      background: #fff;
      border-color: #2563eb;
      box-shadow: 0 12px 26px rgba(37,99,235,.24);
      transform: translateY(-1px);
    }
    .nav-dr {
      width: calc(100% - 28px);
      margin: 6px 14px 14px;
      justify-content: center;
      border-radius: 7px;
    }
    .nav-dr-secondary {
      margin-top: -6px;
    }
    .dr-logo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 116px;
    }
    .dr-logo-text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #0f172a;
      font-weight: 800;
    }
    .nav-dr-opencenter {
      min-height: 88px;
      padding: 12px 14px;
      flex-direction: column;
      gap: 4px;
      background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 45%, #fef2f2 100%);
      border: 1px solid #dbeafe;
      color: #0f172a;
      box-shadow: 0 10px 24px rgba(59,130,246,.14);
    }
    .nav-dr-opencenter:hover {
      border-color: #93c5fd;
      box-shadow: 0 14px 30px rgba(34,197,94,.20);
    }
    .nav-dr-opencenter .oc-badge-sub { color: #2563eb; }
    .oc-badge-mark {
      width: 30px;
      height: 30px;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: linear-gradient(135deg, #3b82f6 0%, #22c55e 50%, #ef4444 100%);
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }
    .oc-badge-title {
      color: #0f172a;
      font-size: 18px;
      font-weight: 900;
      line-height: 1;
    }
    .oc-badge-sub {
      color: #0e7490;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .nav-dr-flex2flex {
      min-height: 88px;
      padding: 12px 14px;
      flex-direction: column;
      gap: 4px;
      background: linear-gradient(135deg, #eff6ff 0%, #ecfdf5 45%, #fef2f2 100%);
      border: 1px solid #dbeafe;
      color: #0f172a;
      box-shadow: 0 10px 24px rgba(59,130,246,.14);
    }
    .nav-dr-flex2flex:hover {
      border-color: #93c5fd;
      box-shadow: 0 14px 30px rgba(34,197,94,.20);
    }
    .nav-dr-flex2flex .oc-badge-sub { color: #2563eb; }
    .f2f-mark {
      background: linear-gradient(135deg, #3b82f6 0%, #22c55e 50%, #ef4444 100%);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(59,130,246,.12);
    }
    .nav-dr-hyperflex {
      min-height: 88px;
      padding: 12px 14px;
      flex-direction: column;
      gap: 4px;
      background:
        radial-gradient(circle at 88% 18%, rgba(255,153,0,.26), transparent 30%),
        linear-gradient(135deg, #fff7ed 0%, #f8fafc 50%, #f1f5f9 100%);
      border: 1px solid #fed7aa;
      color: #0f172a;
      box-shadow: 0 10px 24px rgba(255,153,0,.18);
    }
    .nav-dr-hyperflex:hover {
      border-color: #ff9900;
      box-shadow: 0 14px 30px rgba(255,153,0,.28);
    }
    .nav-dr-hyperflex .oc-badge-sub { color: #b45309; }
    .hf-mark {
      background: #232f3e;
      color: #ff9900;
      box-shadow: 0 0 0 4px rgba(255,153,0,.16);
    }
    .nav-dr-aipower {
      min-height: 88px;
      padding: 12px 14px;
      flex-direction: column;
      gap: 4px;
      background:
        radial-gradient(circle at 88% 18%, rgba(6,182,212,.24), transparent 30%),
        linear-gradient(135deg, #faf5ff 0%, #f5f3ff 45%, #ecfeff 100%);
      border: 1px solid #e9d5ff;
      color: #0f172a;
      box-shadow: 0 10px 24px rgba(124,58,237,.16);
    }
    .nav-dr-aipower:hover {
      border-color: #a855f7;
      box-shadow: 0 14px 30px rgba(124,58,237,.26);
    }
    .nav-dr-aipower .oc-badge-sub { color: #7c3aed; }
    .ai-mark {
      background: linear-gradient(135deg, #6d28d9 0%, #06b6d4 100%);
      color: #ffffff;
      box-shadow: 0 0 0 4px rgba(139,92,246,.16);
    }
    .toolbar-cleanup { display: none !important; }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(43,155,99,.12);
    }
    .spacer { flex: 1; }
    .search {
      width: min(350px, 28vw);
      height: 33px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 10px;
      background: #fff;
      color: #b3bbc7;
      border: 1px solid var(--line);
    }
    .icon-btn {
      width: 34px;
      height: 33px;
      border: 0;
      border-radius: 4px;
      background: #fff;
      color: #222832;
      cursor: pointer;
    }
    .content {
      flex: 1;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }
    .workflow-frame-wrap {
      height: 100%;
      background: #eef1f5;
      border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .workflow-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f6f8;
    }
    .table-card {
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1280px;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 14px 16px;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8f9fb;
      color: #111827;
      font-weight: 600;
      height: 50px;
    }
    td { height: 104px; }
    .check { width: 44px; }
    input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: var(--red);
    }
    .id {
      color: var(--red);
      font-size: 12px;
      margin-bottom: 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .name {
      color: #000;
      font-weight: 700;
      line-height: 1.45;
      max-width: 230px;
      word-break: break-word;
    }
    .image-icon { color: #e23d42; font-size: 18px; }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 8px;
    }
    .actions {
      color: var(--red);
      white-space: nowrap;
    }
    .pager {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 0 20px;
      background: #fff;
      border-top: 1px solid var(--line);
      color: #9aa3b1;
      font-size: 13px;
    }
    .overlay {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      background: rgba(20, 24, 32, .58);
    }
    .overlay.open { display: block; }
    .drawer {
      position: absolute;
      top: 28px;
      right: 28px;
      bottom: 28px;
      left: 28px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-head {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .drawer-title {
      font-weight: 700;
      color: #111827;
    }
    .drawer-sub {
      color: #7a8494;
      font-size: 12px;
    }
    .drawer-close {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      background: #f1f3f6;
      color: #1f2937;
      cursor: pointer;
      font-size: 20px;
    }
    iframe { border: 0; }
    @media (max-width: 900px) {
      .sidebar { width: 58px; }
      .nav-item span:not(.chev), .nav-child { display: none; }
      .main { left: 58px; }
      .brand { width: 104px; }
      .project { display: none; }
      .toolbar { flex-wrap: wrap; }
      .search { width: 100%; order: 2; }
      .drawer { inset: 10px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="hamburger">☰</div>
    <div class="brand">rackspace<small>technology</small></div>
    <div class="project"><span class="grid-icon">▦</span><span>a5dce7f3-1a91-4219-9277-49ecf9e45a78</span><span>↔</span><span class="domain">rackspace_cloud_domain</span></div>
    <div class="profile">⌾</div>
  </header>

  <aside class="sidebar">
    <a class="nav-item" href="#"><span>⌂</span><span>Home</span></a>
    <a class="nav-item section active" href="#"><span>▱ Compute</span><span class="chev">⌃</span></a>
    <a class="nav-child" href="#"><span class="nav-dot"></span><span>Instances</span></a>
    <a class="nav-child active" href="#"><span class="nav-dot"></span><span>Instance Snapshots</span></a>
    <a class="nav-child" href="#"><span class="nav-dot"></span><span>Flavors</span></a>
    <a class="nav-child" href="#"><span class="nav-dot"></span><span>Server Groups</span></a>
    <a class="nav-child" href="#"><span class="nav-dot"></span><span>Images</span></a>
    <a class="nav-child" href="#"><span class="nav-dot"></span><span>Key Pairs</span></a>
    <a class="nav-item section" href="#"><span>▤ Storage</span><span class="chev">⌄</span></a>
    <a class="nav-item section" href="#"><span>◉ Network</span><span class="chev">⌄</span></a>
    <a class="nav-item section" href="#"><span>▣ Orchestration</span><span class="chev">⌄</span></a>
    <a class="nav-item section" href="#"><span>▧ Container</span><span class="chev">⌄</span></a>
    <a class="nav-item section" href="#" onclick="toggleDrButtons(event)"><span>🌈 FLEX Migrations</span><span class="chev" id="flex-tools-chev">⌄</span></a>
    <div id="dr-buttons-container" style="display: none; padding-top: 6px;">
    <button id="flex-region-dr-btn" class="btn btn-dr nav-dr nav-dr-flex2flex" type="button" title="Open Flex2Flex Region DR Cloning workflow" aria-label="Open Flex2Flex Region DR Cloning workflow">
      <span class="oc-badge-mark f2f-mark">⇄</span>
      <span class="oc-badge-title">Flex2Flex</span>
      <span class="oc-badge-sub">Region DR Cloning</span>
    </button>
    <button id="flexanywhere-cross-cloud-btn" class="btn btn-dr nav-dr nav-dr-hyperflex" type="button" title="Open HyperFlex cross-cloud migration workflow" aria-label="Open HyperFlex cross-cloud migration workflow">
      <span class="oc-badge-mark hf-mark">⇅</span>
      <span class="oc-badge-title">HyperFlex</span>
      <span class="oc-badge-sub">Cross Cloud Migration</span>
    </button>
    <button id="opencenter-dr-btn" class="btn btn-dr nav-dr nav-dr-opencenter" type="button" title="Open OpenCenter modernization workflow" aria-label="Open OpenCenter modernization workflow">
      <span class="oc-badge-mark">⌘</span>
      <span class="oc-badge-title">OpenCenter</span>
      <span class="oc-badge-sub">GitOps Modernization</span>
    </button>
    <button id="aipower-dr-btn" class="btn btn-dr nav-dr nav-dr-aipower" type="button" title="Open AI Power Up workflow" aria-label="Open AI Power Up workflow">
      <span class="oc-badge-mark ai-mark">✦</span>
      <span class="oc-badge-title">AI Power Up</span>
      <span class="oc-badge-sub">FLEX AI Modernization</span>
    </button>
    </div>
    <a class="nav-item" href="#"><span>□</span><span>Documentation</span></a>
    <a class="nav-item" href="#"><span>▷</span><span>Getting Started</span></a>
  </aside>

  <main class="main">
    <div class="breadcrumb"><span>Compute</span><span>/</span><strong>Instance Snapshots</strong></div>
    <div class="toolbar">
      <div class="spacer"></div>
    </div>
    <section class="content">
      <div class="workflow-frame-wrap">
        <iframe id="dr-frame" class="workflow-frame" title="FLEX2FLEX Snapshot Migration" src="./The Rackspace Cloud_files/saved_resource.html"></iframe>
      </div>
    </section>
  </main>

  <script>
    (function () {
	      const flex2flexWorkflowUrl = 'https://127.0.0.1:5002/image_migrator/?mode=flex2flex&skin=flexlight';
	      const hyperFlexWorkflowUrl = 'https://127.0.0.1:5002/image_migrator/?mode=flexanywhere&skin=flexlight';
	      const opencenterWorkflowUrl = 'https://127.0.0.1:5002/opencenter';
	      const aipowerWorkflowUrl = 'https://127.0.0.1:5002/ai-powerup';
	      const frame = document.getElementById('dr-frame');
	      const openBtn = document.getElementById('flex-region-dr-btn');
	      const crossCloudBtn = document.getElementById('flexanywhere-cross-cloud-btn');
	      const opencenterBtn = document.getElementById('opencenter-dr-btn');
	      const aipowerBtn = document.getElementById('aipower-dr-btn');

	      try {
	        localStorage.setItem('osflex_global_theme_v1', 'flex-skyline');
	        localStorage.setItem('osflex_global_theme_v2', 'flex-skyline');
	      } catch (_) {}

	      function applyLightThemeToFrame() {
	        if (!frame || !frame.contentWindow) return;
	        try {
	          frame.contentWindow.postMessage({ type: 'osflex-theme', theme: 'flex-skyline' }, 'https://127.0.0.1:5002');
	          if (typeof frame.contentWindow.applyGlobalTheme === 'function') {
	            frame.contentWindow.applyGlobalTheme('flex-skyline', false);
	          }
	        } catch (_) {}
	      }

	      function loadDr() {
	        if (frame) frame.src = flex2flexWorkflowUrl;
	      }

      function refreshFlex2FlexDr() {
        if (frame) frame.src = flex2flexWorkflowUrl + '&_=' + Date.now();
      }

      function refreshHyperFlexDr() {
        if (frame) frame.src = hyperFlexWorkflowUrl + '&_=' + Date.now();
      }

	      function refreshOpenCenter() {
	        if (frame) frame.src = opencenterWorkflowUrl + (opencenterWorkflowUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
	      }

	      function refreshAIPower() {
	        if (frame) frame.src = aipowerWorkflowUrl + (aipowerWorkflowUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
	      }

	      loadDr();
	      if (frame) frame.addEventListener('load', applyLightThemeToFrame);
	      if (openBtn) openBtn.addEventListener('click', refreshFlex2FlexDr);
	      if (crossCloudBtn) crossCloudBtn.addEventListener('click', refreshHyperFlexDr);
	      if (opencenterBtn) opencenterBtn.addEventListener('click', refreshOpenCenter);
	      if (aipowerBtn) aipowerBtn.addEventListener('click', refreshAIPower);
	    })();
    function toggleDrButtons(e) {
      e.preventDefault();
      const container = document.getElementById('dr-buttons-container');
      const chev = document.getElementById('flex-tools-chev');
      if (container.style.display === 'none') {
        container.style.display = 'block';
        chev.textContent = '⌃';
      } else {
        container.style.display = 'none';
        chev.textContent = '⌄';
      }
    }
  </script>
</body>
</html>
