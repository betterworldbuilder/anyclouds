# pvc_restore_helper.pod.yaml
# Helper Pod template for restoring data into a PersistentVolumeClaim on Flex.
#
# Usage:
#   1. Edit PVC_NAME and NAMESPACE below.
#   2. Apply: kubectl apply -f pvc_restore_helper.pod.yaml
#   3. Wait:  kubectl wait pod/pvc-restore-helper -n <ns> --for=condition=Ready --timeout=60s
#   4. Copy:  kubectl cp ./local-data/ <ns>/pvc-restore-helper:/data/
#   5. Or:    kubectl exec -n <ns> pvc-restore-helper -- tar xzf - -C /data < backup.tar.gz
#   6. Clean: kubectl delete pod pvc-restore-helper -n <ns>
#
# Replace PVC_NAME with the actual PVC name and NAMESPACE with your namespace.
---
apiVersion: v1
kind: Pod
metadata:
  name: pvc-restore-helper
  namespace: NAMESPACE            # <-- change this
  labels:
    app: pvc-restore-helper
    migration: ospc-to-flex
  annotations:
    migration/purpose: "Temporary pod for PVC data restore"
    migration/safe-to-delete: "true"
spec:
  restartPolicy: Never
  containers:
    - name: helper
      image: busybox:1.36
      command: ["sh", "-c", "echo 'PVC restore helper ready. Use kubectl cp or kubectl exec.'; sleep 3600"]
      volumeMounts:
        - name: target-pvc
          mountPath: /data
      resources:
        requests:
          cpu: "100m"
          memory: "64Mi"
        limits:
          cpu: "200m"
          memory: "128Mi"
  volumes:
    - name: target-pvc
      persistentVolumeClaim:
        claimName: PVC_NAME       # <-- change this

# ── Common restore operations ─────────────────────────────────────────────────
# Copy a local directory into the PVC:
#   kubectl cp ./mydata/ NAMESPACE/pvc-restore-helper:/data/
#
# Extract a tar archive directly into the PVC:
#   kubectl exec -n NAMESPACE pvc-restore-helper -- sh -c 'tar xzf - -C /data' < backup.tar.gz
#
# Fix permissions after restore (if needed):
#   kubectl exec -n NAMESPACE pvc-restore-helper -- chown -R 1000:1000 /data
#
# Stream from source pod on OSPC:
#   kubectl --context=<ospc-ctx> exec -n NS SOURCE_POD -- tar czf - /data \
#     | kubectl --context=<flex-ctx> exec -i -n NS pvc-restore-helper -- tar xzf - -C /
