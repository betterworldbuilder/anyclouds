<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rackspace Cloud | FLEX Region DR Creation</title>
  <style>
    :root {
      --topbar: #1f232b;
      --sidebar: #ffffff;
      --page: #f4f6f8;
      --panel: #ffffff;
      --line: #e6e9ee;
      --line-strong: #d6dbe3;
      --text: #111827;
      --muted: #687385;
      --red: #b13a3d;
      --red-dark: #9f3033;
      --green: #2b9b63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 14px;
      overflow: hidden;
    }
    button, input, select { font: inherit; }
    .topbar {
      position: fixed;
      z-index: 30;
      top: 0;
      left: 0;
      right: 0;
      height: 42px;
      display: flex;
      align-items: center;
      background: var(--topbar);
      color: #fff;
      box-shadow: 0 1px 3px rgba(0,0,0,.2);
    }
    .hamburger {
      width: 43px;
      height: 42px;
      display: grid;
      place-items: center;
      background: #222936;
      border-right: 1px solid rgba(255,255,255,.06);
      font-size: 24px;
      line-height: 1;
    }
    .brand {
      width: 140px;
      text-align: center;
      font-weight: 700;
      font-style: italic;
      letter-spacing: -.5px;
    }
    .brand small {
      display: block;
      margin-top: -5px;
      font-size: 7px;
      font-style: normal;
      letter-spacing: .2px;
      opacity: .9;
    }
    .project {
      display: flex;
      align-items: center;
      gap: 14px;
      height: 100%;
      padding: 0 18px;
      border-left: 1px solid rgba(255,255,255,.08);
      color: #f7f7f8;
      white-space: nowrap;
    }
    .grid-icon { color: #cfd4dc; font-size: 15px; }
    .domain {
      margin-left: 8px;
      padding-left: 22px;
      border-left: 1px solid rgba(255,255,255,.25);
      font-weight: 600;
    }
    .profile {
      margin-left: auto;
      margin-right: 16px;
      width: 31px;
      height: 31px;
      border-radius: 50%;
      background: #fff;
      color: #20242c;
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
    }
    .sidebar {
      position: fixed;
      z-index: 20;
      top: 42px;
      bottom: 0;
      left: 0;
      width: 212px;
      background: var(--sidebar);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }
    .nav-item {
      height: 47px;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 0 18px;
      color: #1f2937;
      text-decoration: none;
      border-left: 3px solid transparent;
      white-space: nowrap;
    }
    .nav-item.section {
      font-weight: 500;
      justify-content: space-between;
    }
    .nav-item.active {
      background: #f2f4f7;
      border-left-color: var(--red);
      color: #111827;
    }
    .nav-child {
      height: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding-left: 40px;
      color: #344054;
      text-decoration: none;
      font-size: 13px;
    }
    .nav-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #c9ced6;
    }
    .nav-child.active .nav-dot { background: var(--red); }
    .main {
      position: fixed;
      top: 42px;
      left: 212px;
      right: 0;
      bottom: 0;
      display: flex;
      flex-direction: column;
      background: var(--page);
    }
    .breadcrumb {
      display: none;
      background: #fff;
      border-bottom: 1px solid var(--line);
      color: #7a8494;
    }
    .breadcrumb strong { color: #111827; font-weight: 500; }
    .toolbar {
      min-height: 54px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 28px;
      background: #eef1f5;
      border-bottom: 1px solid var(--line);
    }
    .btn {
      border: 0;
      border-radius: 4px;
      height: 33px;
      padding: 0 16px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-red {
      background: var(--red);
      color: #fff;
    }
    .btn-red:hover { background: var(--red-dark); }
    .btn-disabled {
      background: #fff;
      color: #b9c0ca;
      border: 1px solid var(--line);
      cursor: default;
    }
    .btn-dr {
      background: #fff;
      color: #111827;
      margin-left: 0;
      box-shadow: 0 10px 22px rgba(37,99,235,.16);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0;
      height: auto;
      min-height: 0;
      padding: 0;
      line-height: 1.1;
      border: 1px solid #dbeafe;
      overflow: hidden;
    }
    .btn-dr:hover {
      background: #fff;
      border-color: #2563eb;
      box-shadow: 0 12px 26px rgba(37,99,235,.24);
      transform: translateY(-1px);
    }
    .nav-dr {
      width: calc(100% - 28px);
      margin: 6px 14px 14px;
      justify-content: center;
      border-radius: 7px;
    }
    .nav-dr-secondary {
      margin-top: -6px;
    }
    .dr-logo {
      display: block;
      width: 100%;
      height: auto;
      max-height: 116px;
    }
    .dr-logo-text {
      font-family: Arial, Helvetica, sans-serif;
      fill: #0f172a;
      font-weight: 800;
    }
    .toolbar-cleanup { display: none !important; }
    .pulse {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 0 4px rgba(43,155,99,.12);
    }
    .spacer { flex: 1; }
    .search {
      width: min(350px, 28vw);
      height: 33px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 0 10px;
      background: #fff;
      color: #b3bbc7;
      border: 1px solid var(--line);
    }
    .icon-btn {
      width: 34px;
      height: 33px;
      border: 0;
      border-radius: 4px;
      background: #fff;
      color: #222832;
      cursor: pointer;
    }
    .content {
      flex: 1;
      min-height: 0;
      padding: 0;
      overflow: hidden;
    }
    .workflow-frame-wrap {
      height: 100%;
      background: #eef1f5;
      border-top: 1px solid var(--line);
      overflow: hidden;
    }
    .workflow-frame {
      display: block;
      width: 100%;
      height: 100%;
      border: 0;
      background: #f4f6f8;
    }
    .table-card {
      height: 100%;
      background: var(--panel);
      border: 1px solid var(--line);
      overflow: auto;
    }
    table {
      width: 100%;
      min-width: 1280px;
      border-collapse: collapse;
      background: #fff;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      text-align: left;
      padding: 14px 16px;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      background: #f8f9fb;
      color: #111827;
      font-weight: 600;
      height: 50px;
    }
    td { height: 104px; }
    .check { width: 44px; }
    input[type="checkbox"] {
      width: 13px;
      height: 13px;
      accent-color: var(--red);
    }
    .id {
      color: var(--red);
      font-size: 12px;
      margin-bottom: 5px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .name {
      color: #000;
      font-weight: 700;
      line-height: 1.45;
      max-width: 230px;
      word-break: break-word;
    }
    .image-icon { color: #e23d42; font-size: 18px; }
    .status-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--green);
      margin-right: 8px;
    }
    .actions {
      color: var(--red);
      white-space: nowrap;
    }
    .pager {
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 14px;
      padding: 0 20px;
      background: #fff;
      border-top: 1px solid var(--line);
      color: #9aa3b1;
      font-size: 13px;
    }
    .overlay {
      position: fixed;
      z-index: 80;
      inset: 0;
      display: none;
      background: rgba(20, 24, 32, .58);
    }
    .overlay.open { display: block; }
    .drawer {
      position: absolute;
      top: 28px;
      right: 28px;
      bottom: 28px;
      left: 28px;
      background: #fff;
      border-radius: 4px;
      box-shadow: 0 24px 70px rgba(0,0,0,.32);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .drawer-head {
      height: 48px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }
    .drawer-title {
      font-weight: 700;
      color: #111827;
    }
    .drawer-sub {
      color: #7a8494;
      font-size: 12px;
    }
    .drawer-close {
      margin-left: auto;
      width: 32px;
      height: 32px;
      border: 0;
      border-radius: 4px;
      background: #f1f3f6;
      color: #1f2937;
      cursor: pointer;
      font-size: 20px;
    }
    iframe { border: 0; }
    @media (max-width: 900px) {
      .sidebar { width: 58px; }
      .nav-item span:not(.chev), .nav-child { display: none; }
      .main { left: 58px; }
      .brand { width: 104px; }
      .project { display: none; }
      .toolbar { flex-wrap: wrap; }
      .search { width: 100%; order: 2; }
      .drawer { inset: 10px; }
    }
  </style>
</head>
<body>

  <main class="main">
    <div class="breadcrumb"><span>Compute</span><span>/</span><strong>Instance Snapshots</strong></div>
    <div class="toolbar">
      <div class="spacer"></div>
    </div>
    <section class="content">
      <div class="workflow-frame-wrap">
        <iframe id="dr-frame" class="workflow-frame" title="FLEX2FLEX Snapshot Migration"></iframe>
      </div>
    </section>
  </main>

  <script>
    (function () {
      const flex2flexWorkflowUrl = '/image_migrator/?mode=flex2flex&skin=flexlight';
      const hyperFlexWorkflowUrl = '/image_migrator/?mode=flexanywhere&skin=flexlight';
      const ospcWorkflowUrl = '/image_migrator/?skin=flexlight';
      const frame = document.getElementById('dr-frame');
      const ospcBtn = document.getElementById('ospc2flex-dr-btn');
      const openBtn = document.getElementById('flex-region-dr-btn');
      const crossCloudBtn = document.getElementById('flexanywhere-cross-cloud-btn');

      function loadDr() {
        if (frame) frame.src = flex2flexWorkflowUrl;
      }

      function refreshFlex2FlexDr() {
        if (frame) frame.src = flex2flexWorkflowUrl + '&_=' + Date.now();
      }

      function refreshHyperFlexDr() {
        if (frame) frame.src = hyperFlexWorkflowUrl + '&_=' + Date.now();
      }

      function refreshOspcDr() {
        if (frame) frame.src = ospcWorkflowUrl + (ospcWorkflowUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
      }

      loadDr();
      if (ospcBtn) ospcBtn.addEventListener('click', refreshOspcDr);
      if (openBtn) openBtn.addEventListener('click', refreshFlex2FlexDr);
      if (crossCloudBtn) crossCloudBtn.addEventListener('click', refreshHyperFlexDr);
    })();
    function toggleDrButtons(e) {
      e.preventDefault();
      const container = document.getElementById('dr-buttons-container');
      const chev = document.getElementById('flex-tools-chev');
      if (container.style.display === 'none') {
        container.style.display = 'block';
        chev.textContent = '⌃';
      } else {
        container.style.display = 'none';
        chev.textContent = '⌄';
      }
    }
  </script>
</body>
</html>
