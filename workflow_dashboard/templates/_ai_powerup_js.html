<script>
/* ══════════════════════════════════════════════════════════════════════════════
   STAGE 9 — AI POWER UP  (stage key: sai)
   localStorage key: ospcFlex_stage9_aiPowerUp
══════════════════════════════════════════════════════════════════════════════ */

window.rackspaceAIConnectors = {

  fairDiagnostic:   { enabled: false, endpoint: '', status: 'stub' },

  aiAnywhere:       { enabled: false, endpoint: '', status: 'stub' },
  enterpriseAICloud:{ enabled: false, endpoint: '', status: 'stub' },
  fde:              { enabled: false, endpoint: '', status: 'stub' },
  palantir:         { enabled: false, endpoint: '', status: 'stub' },
  uniphore:         { enabled: false, endpoint: '', status: 'stub' },
  dell:             { enabled: false, endpoint: '', status: 'stub' },
  vmware:           { enabled: false, endpoint: '', status: 'stub' },
  rubrik:           { enabled: false, endpoint: '', status: 'stub' },
  amd:              { enabled: false, endpoint: '', status: 'stub' }
};

var SAI_KEY = 'ospcFlex_stage9_aiPowerUp';

var SAI_DEMO_SYSTEMS = [
  { name:'Customer Portal',        vms:4,  data:'documents,tickets,emails',      sensitivity:'medium', migStatus:'Migrated' },
  { name:'Billing Platform',       vms:6,  data:'database,logs,APIs',            sensitivity:'high',   migStatus:'Migrated' },
  { name:'Support Knowledge Base', vms:2,  data:'documents,tickets',             sensitivity:'low',    migStatus:'Migrated' },
  { name:'Claims / Ticketing',     vms:5,  data:'tickets,documents,images',      sensitivity:'high',   migStatus:'Migrated' },
  { name:'Data Warehouse',         vms:8,  data:'database,logs',                 sensitivity:'medium', migStatus:'Migrated' },
  { name:'ERP / Finance System',   vms:10, data:'database,APIs,emails',          sensitivity:'regulated', migStatus:'Migrated' }
];

var SAI_GOALS = [
  { id:'support',    icon:'💬', label:'Faster Customer Support',     hint:'Ticket triage, suggested resolution, auto-summary' },
  { id:'rag',        icon:'🔍', label:'Knowledge Search / RAG',      hint:'AI chatbot over documents, KB, tickets' },
  { id:'summarize',  icon:'📄', label:'Document Summarization',      hint:'Summarize contracts, cases, reports' },
  { id:'automate',   icon:'⚙️', label:'Ticket / Case Automation',   hint:'Auto-route, auto-resolve, auto-classify' },
  { id:'ops',        icon:'🔧', label:'Operations Automation',       hint:'AIOps, incident summary, root-cause' },
  { id:'revenue',    icon:'💰', label:'Revenue Growth',              hint:'Next-best offer, churn prediction, upsell AI' },
  { id:'risk',       icon:'🛡', label:'Risk / Compliance',           hint:'Compliance checks, audit trail, risk alerts' },
  { id:'exec',       icon:'📊', label:'Executive Insights',          hint:'NL reporting, dashboards, trend alerts' },
  { id:'agents',     icon:'🤖', label:'AI Agents',                   hint:'Workflow automation, approvals, CRM/ERP bots' },
  { id:'inference',  icon:'⚡', label:'Production Inference',         hint:'Model serving, fine-tuning, high-volume inference' }
];

var SAI_DATA_TYPES = ['documents','tickets','logs','database','images','call transcripts','emails','APIs','object storage','event streams'];
var SAI_SENSITIVITIES = [
  { v:'low',       label:'Low',       col:'#34d399' },
  { v:'medium',    label:'Medium',    col:'#fbbf24' },
  { v:'high',      label:'High',      col:'#f87171' },
  { v:'regulated', label:'Regulated', col:'#c084fc' }
];

var SAI_GOV_ITEMS = [
  'Business owner identified','Data owner identified','Data location known',
  'Data classification complete','PII / sensitive data reviewed',
  'Access model defined','API / database connectivity confirmed',
  'RAG / vector store need assessed','Model / inference environment selected',
  'Compliance requirements captured','Success metrics defined','Production owner assigned'
];

var saiState = {
  systems: [], selectedSystem: null, selectedGoal: null,
  selectedData: [], selectedSensitivity: 'low', selectedEnv: 'flex',
  selectedSystemId: '', recommendation: null, launchPadPlan: null, govChecks: {}
};

function saiEscape(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, function(ch) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]);
  });
}

function saiSystemKey(sys) {
  return String((sys && (sys.id || sys.name)) || '');
}

function saiComponentName(component) {
  if (typeof component === 'string') return component.trim();
  if (!component || typeof component !== 'object') return '';
  return String(component.name || component.component || component.role || '').trim();
}

function saiCount(value) {
  if (Array.isArray(value)) return value.length;
  if (value && typeof value === 'object') return Object.keys(value).length;
  var count = parseInt(value, 10);
  return isNaN(count) ? 0 : count;
}

function saiInferDataTypes(system, componentNames) {
  var supplied = system.data || system.dataTypes || system.data_type || system.dataTypesAvailable;
  var types = Array.isArray(supplied)
    ? supplied.map(function(v) { return String(v).trim(); }).filter(Boolean)
    : String(supplied || '').split(',').map(function(v) { return v.trim(); }).filter(Boolean);
  var haystack = componentNames.join(' ').toLowerCase();
  function add(label, pattern) {
    if (pattern.test(haystack) && types.indexOf(label) < 0) types.push(label);
  }
  add('database', /database|\bdb\b|postgres|mysql|oracle|sql server|mongo/);
  add('APIs', /\bapi\b|gateway|webhook|integration/);
  add('documents', /document|file|knowledge|report|content/);
  add('object storage', /object storage|swift|s3|blob/);
  add('tickets', /ticket|case|support|claim/);
  add('event streams', /queue|event|kafka|rabbit|stream/);
  add('logs', /log|monitor|audit|observability/);
  return types;
}

function saiNormalizeMigrationSystem(system, sourceLabel) {
  system = system && typeof system === 'object' ? system : {};
  var components = Array.isArray(system.components)
    ? system.components.slice()
    : (Array.isArray(system.parts) ? system.parts.slice() : []);
  var componentNames = components.map(saiComponentName).filter(Boolean);
  var vmSource = system.vms != null ? system.vms
    : (system.vm_count != null ? system.vm_count
    : (system.servers != null ? system.servers : system.apps));
  var sensitivity = String(system.sensitivity || system.confidentiality || 'medium').toLowerCase();
  if (['low','medium','high','regulated'].indexOf(sensitivity) < 0) sensitivity = 'medium';
  var name = String(system.name || system.system || system.label || system.customer || 'Unknown Business System').trim();
  var normalized = Object.assign({}, system, {
    id: system.id || system.business_system_id || name,
    name: name,
    vms: saiCount(vmSource),
    components: components,
    componentNames: componentNames,
    dataTypes: saiInferDataTypes(system, componentNames),
    sensitivity: sensitivity,
    migStatus: system.migStatus || 'Migrated',
    sourceStatus: system.status || '',
    sourceLabel: sourceLabel || 'Migration Log',
    isMigrationLogSystem: sourceLabel === 'Migration Log'
  });
  normalized.data = normalized.dataTypes.join(',');
  return normalized;
}

function saiReadMigrationLogSystems() {
  try {
    var raw = localStorage.getItem('uatS1_systems');
    var rows = raw ? JSON.parse(raw) : [];
    if (!Array.isArray(rows)) return [];
    return rows.filter(function(row) { return row && (row.name || row.system || row.label); })
      .map(function(row) { return saiNormalizeMigrationSystem(row, 'Migration Log'); });
  } catch (e) {
    return [];
  }
}

function saiReadLegacyTrackerSystems() {
  try {
    var raw = localStorage.getItem('osflex_migration_tracker');
    var parsed = raw ? JSON.parse(raw) : [];
    var rows = Array.isArray(parsed)
      ? parsed
      : (parsed.systems || parsed.rows || parsed.servers || []);
    return (Array.isArray(rows) ? rows : [])
      .filter(function(row) {
        var status = String(row.status || row.migStatus || '').toLowerCase();
        return !status || status === 'migrated' || status === 'active' || status === 'complete';
      })
      .map(function(row) { return saiNormalizeMigrationSystem(row, 'Migration Tracker'); });
  } catch (e) {
    return [];
  }
}

/* ─── INIT ───────────────────────────────────────────────────────────── */
window.initStage9 = function() {
  loadStage9State();
  renderAIGoals();
  renderDataTypes();
  renderSensitivityBtns();
  renderChecklist();
  importMigratedSystemsForAI({ silent: true, preserveSelection: true });
  if (!saiState.selectedSystem && saiState.systems.length) {
    selectAISystem(saiState.systems[0]);
  }
  // The Migration Log editor is the default AI SWITCH Stage view. In the focused
  // standalone page the editor is not present, so this gracefully keeps the
  // already-imported rich cards visible instead.
  saiUseMigrationLogSystems();
  saiInstallMigrationLogSync();
};

/* ─── IMPORT SYSTEMS ──────────────────────────────────────────────────── */
window.importMigratedSystemsForAI = function(options) {
  options = options && typeof options === 'object' ? options : {};
  var msg = document.getElementById('sai-import-msg');
  var selectedId = options.preserveSelection !== false
    ? (saiState.selectedSystemId || saiSystemKey(saiState.selectedSystem))
    : '';
  var migrationSystems = saiReadMigrationLogSystems();
  var trackerSystems = migrationSystems.length ? [] : saiReadLegacyTrackerSystems();

  if (migrationSystems.length) {
    saiState.systems = migrationSystems;
    if (msg) {
      msg.style.display = 'block';
      msg.textContent = 'Loaded ' + migrationSystems.length + ' Business Apps System' +
        (migrationSystems.length === 1 ? '' : 's') +
        ' from the Migration Log, including their declared components.';
    }
  } else if (trackerSystems.length) {
    saiState.systems = trackerSystems;
    if (msg) {
      msg.style.display = 'block';
      msg.textContent = 'Loaded ' + trackerSystems.length +
        ' migrated system(s) from the legacy Migration Tracker. Add Business Apps Systems to the Migration Log to include component detail.';
    }
  } else {
    saiState.systems = SAI_DEMO_SYSTEMS.map(function(system) {
      return saiNormalizeMigrationSystem(Object.assign({}, system, { isDemo: true }), 'Demo');
    });
    if (msg) {
      msg.style.display = 'block';
      msg.textContent = 'No Business Apps Systems are in the Migration Log yet. Demo systems are shown and clearly labelled.';
    }
  }

  var selected = selectedId
    ? saiState.systems.filter(function(system) { return saiSystemKey(system) === selectedId; })[0]
    : null;
  saiState.selectedSystem = selected || null;
  saiState.selectedSystemId = selected ? saiSystemKey(selected) : '';
  if (selected && typeof window.saiAdoptUseSystem === 'function') {
    window.saiAdoptUseSystem(selected);
  }
  renderSystemsGrid();
  renderOpportunityTable();
  renderUpsellTable();
  updateCounters();
  saiDecorateMigrationLogSelection();
  saveStage9State();
};

/* ─── RENDER SYSTEMS GRID ─────────────────────────────────────────────── */
function renderSystemsGrid() {
  var el = document.getElementById('sai-systems-grid');
  if (!el) return;
  el.innerHTML = '';
  if (!saiState.systems.length) {
    el.innerHTML = '<div style="grid-column:1/-1;padding:18px;text-align:center;color:#64748b;">No Business Apps Systems found in the Migration Log.</div>';
    return;
  }
  saiState.systems.forEach(function(sys) {
    var isSelected = saiState.selectedSystemId && saiState.selectedSystemId === saiSystemKey(sys);
    var components = sys.componentNames || (sys.components || []).map(saiComponentName).filter(Boolean);
    var card = document.createElement('div');
    card.className = 'sai-system-card';
    card.setAttribute('role', 'button');
    card.setAttribute('tabindex', '0');
    card.setAttribute('aria-pressed', isSelected ? 'true' : 'false');
    card.setAttribute('data-sai-system-id', saiSystemKey(sys));
    card.setAttribute('aria-label', 'Use ' + sys.name + ' for the AI workflow');
    card.style.cssText = 'border-radius:10px;padding:14px;cursor:pointer;transition:border-color .15s,box-shadow .15s,transform .15s;';
    var badges = [];
    if (sys.archetype) badges.push('<span style="background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;">' + saiEscape(sys.archetype) + '</span>');
    if (sys.criticality) badges.push('<span style="background:#fff7ed;color:#c2410c;border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;">' + saiEscape(sys.criticality) + '</span>');
    badges.push('<span style="background:' + (sys.isDemo ? '#fff7ed' : '#dcfce7') + ';color:' + (sys.isDemo ? '#c2410c' : '#15803d') + ';border-radius:999px;padding:2px 7px;font-size:9px;font-weight:800;">' + (sys.isDemo ? 'DEMO' : saiEscape(sys.sourceLabel || 'MIGRATION LOG').toUpperCase()) + '</span>');
    card.innerHTML =
      '<div style="display:flex;justify-content:space-between;gap:8px;align-items:flex-start;">' +
        '<div style="font-size:14px;font-weight:800;color:#172033;margin-bottom:4px;">' + saiEscape(sys.name) + '</div>' +
        (isSelected ? '<span style="color:#007aff;font-size:10px;font-weight:900;white-space:nowrap;">&#10003; AI TARGET</span>' : '') +
      '</div>' +
      '<div style="font-size:10px;color:#64748b;">' + saiEscape(sys.vms || 0) + ' VMs &bull; ' +
        components.length + ' components' + (sys.region ? ' &bull; ' + saiEscape(sys.region) : '') + '</div>' +
      (components.length
        ? '<div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;">' +
          components.slice(0, 6).map(function(name) {
            return '<span style="background:#f1f5f9;color:#475569;border-radius:5px;padding:2px 6px;font-size:9px;font-weight:650;">' + saiEscape(name) + '</span>';
          }).join('') +
          (components.length > 6 ? '<span style="color:#64748b;font-size:9px;padding:2px;">+' + (components.length - 6) + ' more</span>' : '') +
          '</div>'
        : '<div style="margin-top:8px;color:#b45309;font-size:10px;">No components declared yet</div>') +
      '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-top:9px;">' + badges.join('') + '</div>';
    card.onclick = function() { selectAISystem(sys); };
    card.onkeydown = function(event) {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        selectAISystem(sys);
      }
    };
    el.appendChild(card);
  });
  renderSelectedBusinessSystem();
}

/* ─── SELECT SYSTEM ───────────────────────────────────────────────────── */
window.selectAISystem = function(sys) {
  saiState.selectedSystem = sys;
  saiState.selectedSystemId = saiSystemKey(sys);
  if (sys.sensitivity) saiState.selectedSensitivity = sys.sensitivity;
  if (!saiState.selectedData.length && sys.dataTypes && sys.dataTypes.length) {
    saiState.selectedData = sys.dataTypes.slice();
  }
  if (typeof window.saiAdoptUseSystem === 'function') window.saiAdoptUseSystem(sys);
  renderSystemsGrid();
  renderDataTypes();
  renderSensitivityBtns();
  saiDecorateMigrationLogSelection();
  saveStage9State();
};

function renderSelectedBusinessSystem() {
  var el = document.getElementById('sai-selected-business-system');
  if (!el) return;
  var sys = saiState.selectedSystem;
  if (!sys) {
    el.style.display = 'none';
    el.innerHTML = '';
    return;
  }
  var components = sys.componentNames || (sys.components || []).map(saiComponentName).filter(Boolean);
  el.innerHTML = '<div style="font-size:12px;font-weight:800;color:#172033;">AI workflow target: ' + saiEscape(sys.name) + '</div>' +
    '<div style="font-size:10px;color:#64748b;margin-top:3px;">System ID: ' + saiEscape(saiSystemKey(sys)) +
    ' &bull; ' + components.length + ' declared components will be sent to the AI assessment and production plan.</div>';
  el.style.display = 'block';
}

function saiFindMigrationLogSystem(id) {
  var systems = saiReadMigrationLogSystems();
  return systems.filter(function(system) {
    return saiSystemKey(system) === String(id || '');
  })[0] || null;
}

function saiWireMigrationLogEngine() {
  var host = document.getElementById('sai-fsm-uat-engine-host');
  if (!host || host._saiSelectionWired) return;
  host._saiSelectionWired = true;
  host.addEventListener('click', function(event) {
    if (event.target && event.target.closest && event.target.closest('button')) return;
    var card = event.target && event.target.closest ? event.target.closest('[data-bz-card]') : null;
    if (!card) return;
    var system = saiFindMigrationLogSystem(card.getAttribute('data-bz-card'));
    if (system) selectAISystem(system);
  }, true);
  host.addEventListener('keydown', function(event) {
    if (event.key !== 'Enter' && event.key !== ' ') return;
    var card = event.target && event.target.closest ? event.target.closest('[data-bz-card]') : null;
    if (!card) return;
    var system = saiFindMigrationLogSystem(card.getAttribute('data-bz-card'));
    if (system) {
      event.preventDefault();
      selectAISystem(system);
    }
  }, true);
}

function saiDecorateMigrationLogSelection() {
  var host = document.getElementById('sai-fsm-uat-engine-host');
  if (!host) return;
  Array.prototype.forEach.call(host.querySelectorAll('[data-bz-card]'), function(card) {
    var selected = card.getAttribute('data-bz-card') === saiState.selectedSystemId;
    card.style.cursor = 'pointer';
    card.style.borderColor = selected ? '#007aff' : '';
    card.style.boxShadow = selected ? '0 0 0 3px rgba(0,122,255,.16)' : '';
    card.setAttribute('aria-pressed', selected ? 'true' : 'false');
    card.setAttribute('tabindex', '0');
  });
}

window.saiUseMigrationLogSystems = function() {
  importMigratedSystemsForAI({ preserveSelection: true });
  var grid = document.getElementById('sai-systems-grid');
  var host = document.getElementById('sai-fsm-uat-engine-host');
  var hint = document.getElementById('sai-bizsys-hint');
  var engine = document.getElementById('uatS1SystemsView');
  if (engine && typeof window.saiMountBusinessSystems === 'function') {
    window.saiMountBusinessSystems();
    if (grid) grid.style.display = 'none';
    if (host) host.style.display = 'block';
    saiWireMigrationLogEngine();
    saiDecorateMigrationLogSelection();
    if (hint) hint.textContent = 'Select a system card to make it the AI target. Add or edit components here; the Migration Log, UAT and cutover views update together.';
  } else {
    if (grid) grid.style.display = 'grid';
    if (host) host.style.display = 'none';
    if (hint) hint.textContent = 'Business systems and components imported. Editing is available from the full Migration Log stage.';
  }
};

window.saiUseSimpleSystemCards = function() {
  var grid = document.getElementById('sai-systems-grid');
  var host = document.getElementById('sai-fsm-uat-engine-host');
  var hint = document.getElementById('sai-bizsys-hint');
  if (typeof window.saiRestoreBusinessSystems === 'function') window.saiRestoreBusinessSystems();
  if (host) host.style.display = 'none';
  if (grid) grid.style.display = 'grid';
  renderSystemsGrid();
  if (hint) hint.textContent = 'Simple view of the same Migration Log systems. Select one to wire it to the AI workflow.';
};

function saiInstallMigrationLogSync() {
  if (window._saiMigrationLogSyncInstalled) return;
  window._saiMigrationLogSyncInstalled = true;
  window.addEventListener('storage', function(event) {
    if (event && event.key === 'uatS1_systems') {
      importMigratedSystemsForAI({ silent: true, preserveSelection: true });
    }
  });
  window.addEventListener('uatS1:businessSystemsChanged', function() {
    importMigratedSystemsForAI({ silent: true, preserveSelection: true });
    setTimeout(saiDecorateMigrationLogSelection, 0);
  });
}

/* ─── RENDER GOAL CARDS ───────────────────────────────────────────────── */
function renderAIGoals() {
  var el = document.getElementById('sai-goals-grid');
  if (!el) return;
  el.innerHTML = '';
  SAI_GOALS.forEach(function(g) {
    var isSelected = saiState.selectedGoal === g.id;
    var card = document.createElement('div');
    card.style.cssText = 'background:' + (isSelected ? 'rgba(6,182,212,.2)' : 'rgba(30,41,59,.6)') + ';border:2px solid ' + (isSelected ? '#22d3ee' : 'rgba(255,255,255,.08)') + ';border-radius:10px;padding:12px;cursor:pointer;transition:border-color .15s;';
    card.innerHTML = '<div style="font-size:20px;margin-bottom:6px;">' + g.icon + '</div>'
      + '<div style="font-size:12px;font-weight:800;color:#e2e8f0;margin-bottom:4px;">' + g.label + '</div>'
      + '<div style="font-size:10px;color:#64748b;line-height:1.4;">' + g.hint + '</div>';
    card.onclick = function() { saiState.selectedGoal = g.id; renderAIGoals(); };
    el.appendChild(card);
  });
}

/* ─── RENDER DATA TYPES ───────────────────────────────────────────────── */
function renderDataTypes() {
  var el = document.getElementById('sai-data-grid');
  if (!el) return;
  el.innerHTML = '';
  SAI_DATA_TYPES.forEach(function(dt) {
    var isSelected = saiState.selectedData.indexOf(dt) >= 0;
    var btn = document.createElement('button');
    btn.style.cssText = 'background:' + (isSelected ? 'rgba(109,40,217,.25)' : 'rgba(30,41,59,.6)') + ';border:1px solid ' + (isSelected ? '#a78bfa' : 'rgba(255,255,255,.1)') + ';border-radius:6px;color:' + (isSelected ? '#a78bfa' : '#94a3b8') + ';padding:5px 10px;font-size:10px;font-weight:600;cursor:pointer;transition:all .15s;';
    btn.textContent = dt;
    btn.onclick = function() {
      var idx = saiState.selectedData.indexOf(dt);
      if (idx >= 0) saiState.selectedData.splice(idx,1); else saiState.selectedData.push(dt);
      renderDataTypes();
    };
    el.appendChild(btn);
  });
}

/* ─── RENDER SENSITIVITY BUTTONS ─────────────────────────────────────── */
function renderSensitivityBtns() {
  var el = document.getElementById('sai-sensitivity-btns');
  if (!el) return;
  el.innerHTML = '';
  SAI_SENSITIVITIES.forEach(function(s) {
    var isSelected = saiState.selectedSensitivity === s.v;
    var btn = document.createElement('button');
    btn.style.cssText = 'background:' + (isSelected ? 'rgba(0,0,0,.3)' : 'rgba(30,41,59,.6)') + ';border:2px solid ' + (isSelected ? s.col : 'rgba(255,255,255,.1)') + ';border-radius:6px;color:' + (isSelected ? s.col : '#64748b') + ';padding:6px 14px;font-size:11px;font-weight:700;cursor:pointer;transition:all .15s;';
    btn.textContent = s.label;
    btn.onclick = function() { saiState.selectedSensitivity = s.v; renderSensitivityBtns(); };
    el.appendChild(btn);
  });
}

/* ─── RECOMMEND AI PATH ───────────────────────────────────────────────── */
window.recommendAIPath = function() {
  if (!saiState.selectedSystem) {
    var msg = document.getElementById('sai-import-msg');
    if (msg) {
      msg.style.display = 'block';
      msg.textContent = 'Select a Business Apps System from the Migration Log before generating an AI recommendation.';
      msg.scrollIntoView({ behavior:'smooth', block:'nearest' });
    }
    return;
  }
  var rec = recommendRackspaceAIService({
    system: saiState.selectedSystem,
    goal: saiState.selectedGoal,
    data: saiState.selectedData,
    sensitivity: saiState.selectedSensitivity,
    env: (document.getElementById('sai-env')||{}).value || 'flex'
  });
  saiState.recommendation = rec;

  var div = document.getElementById('sai-recommendation');
  if (!div) return;
  div.style.display = 'block';
  setText('sai-rec-system',  rec.system);
  setText('sai-rec-goal',    rec.goalLabel);
  setText('sai-rec-connect', rec.connectMethod);
  setText('sai-rec-service', rec.service);
  setText('sai-rec-scaleup', rec.scaleUp);
  setText('sai-rec-poc',     rec.poc2wk);
  setText('sai-rec-sales',   rec.salesNext);
  setText('sai-rec-tech',    rec.techNext);
  div.scrollIntoView({ behavior:'smooth', block:'nearest' });
  saveStage9State();
};

/* ─── RECOMMENDATION LOGIC ────────────────────────────────────────────── */
window.recommendRackspaceAIService = function(params) {
  var goal = params.goal || 'rag';
  var sens = params.sensitivity || 'low';
  var env  = params.env || 'flex';
  var sysName = (params.system && params.system.name) ? params.system.name : 'Your FLEX Business System';
  var goalObj = SAI_GOALS.filter(function(g){ return g.id === goal; })[0] || { label:'AI Improvement' };

  var service, scaleUp, connectMethod, poc2wk, salesNext, techNext;

  // Connect vs Clone guidance
  var cloneRecommended = (sens === 'regulated' || sens === 'high');
  var connectMode = cloneRecommended ? 'Clone (masked dataset / DB copy / VM snapshot)' : 'Connect (read-only API / DB replica / document ingestion)';

  if (sens === 'regulated' || sens === 'high' || env === 'private' || env === 'sovereign') {
    service = 'Private Cloud AI / AI Anywhere';
    scaleUp = 'AI Anywhere → Enterprise AI Cloud → FDE';
    connectMethod = 'Private network + masked DB clone + secure data pipeline';
    poc2wk = 'Wk 1: Data sensitivity review + private AI infra sizing.\nWk 2: Secure data pipeline + private AI LaunchPad POC on isolated clone.';
    salesNext = 'Schedule Private AI architecture session. Position data sovereignty and compliance.';
    techNext = 'Size private AI infra. Define masked clone pipeline. Confirm security model.';
  } else if (goal === 'agents' || goal === 'automate') {
    service = 'AI LaunchPad → Uniphore + FDE';
    scaleUp = 'Uniphore → Enterprise AI Cloud';
    connectMethod = 'App API + ticketing system connector + CRM/ERP integration';
    poc2wk = 'Wk 1: Map workflow automation use case + API connectivity.\nWk 2: POC agentic workflow with Uniphore + Rackspace FDE.';
    salesNext = 'FDE discovery call. Position Uniphore agentic platform over FLEX workloads.';
    techNext = 'Map API endpoints. Define agent trigger/action graph. Confirm integration layer.';
  } else if (goal === 'inference') {
    service = 'AI Business / Inference Platform (Dell + AMD path)';
    scaleUp = 'Enterprise AI Cloud';
    connectMethod = 'App API to inference endpoint + feature data batch export';
    poc2wk = 'Wk 1: Inventory VM / CPU / GPU sizing from FLEX migration data.\nWk 2: Define inference architecture + select model serving platform.';
    salesNext = 'Dell/AMD infrastructure session. Present GPU/CPU sizing from FLEX discovery.';
    techNext = 'Export FLEX VM sizing data. Size inference cluster. Select model serving stack.';
  } else if (goal === 'risk' && (sens === 'regulated' || sens === 'high')) {
    service = 'FAIR Diagnostic + Private Cloud AI';
    scaleUp = 'Private Cloud AI → Enterprise AI Cloud';
    connectMethod = 'Compliance document ingestion + audit log pipeline + secure DB replica';
    poc2wk = 'Wk 1: FAIR AI readiness assessment + compliance gap review.\nWk 2: Risk AI POC on isolated dataset — flag, classify, alert.';
    salesNext = 'FAIR Diagnostic workshop. Lead with compliance ROI and risk reduction.';
    techNext = 'Ingest compliance docs. Build risk-scoring model. Define alert thresholds.';
  } else if (goal === 'exec' || goal === 'revenue') {
    service = 'FAIR Diagnostic / Ideate';
    scaleUp = 'AI LaunchPad → Enterprise AI Cloud';
    connectMethod = 'Database read replica + API connectors + data warehouse export';
    poc2wk = 'Wk 1: FAIR AI use case ideation workshop. Map executive KPIs to AI outputs.\nWk 2: POC NL reporting or revenue prediction on FLEX data.';
    salesNext = 'Schedule FAIR Ideate workshop. Lead with executive insight and revenue AI story.';
    techNext = 'Connect DB replica. Build NL query layer or prediction model. Define KPI dashboard.';
  } else {
    // Default: AI LaunchPad for RAG/support/summarize/ops
    service = 'AI LaunchPad';
    scaleUp = 'FAIR Incubate → Private Cloud AI → Enterprise AI Cloud';
    connectMethod = 'Read-only API + document ingestion + RAG / vector database pipeline';
    poc2wk = 'Wk 1: Connect FLEX system data (documents / tickets / KB) to RAG pipeline.\nWk 2: Deploy AI LaunchPad chatbot / summarizer POC on FLEX-hosted data.';
    salesNext = 'AI LaunchPad intro call. Show quick POC on their migrated FLEX data.';
    techNext = 'Stand up vector database. Ingest FLEX-hosted documents / tickets. Deploy RAG endpoint.';
  }

  return {
    system: sysName,
    goalLabel: goalObj.label || goal,
    service: service,
    scaleUp: scaleUp,
    connectMode: connectMode,
    connectMethod: connectMethod,
    poc2wk: poc2wk,
    salesNext: salesNext,
    techNext: techNext
  };
};

function renderOpportunityTable() {
  var tbody = document.getElementById('sai-opp-tbody');
  if (!tbody) return;
  var systems = saiState.systems.length ? saiState.systems : SAI_DEMO_SYSTEMS;
  tbody.innerHTML = '';
  systems.forEach(function(sys) {
    var score = calculateAIReadiness(sys);
    var rec = recommendRackspaceAIService({ system: sys, goal: 'rag', sensitivity: sys.sensitivity, env: 'flex' });
    var scoreCol = score >= 70 ? '#34d399' : score >= 40 ? '#fbbf24' : '#f87171';
    var sensCol = { low:'#34d399', medium:'#fbbf24', high:'#f87171', regulated:'#c084fc' }[sys.sensitivity] || '#94a3b8';
    var tr = document.createElement('tr');
    tr.style.borderBottom = '1px solid rgba(255,255,255,.04)';
    tr.innerHTML = '<td style="padding:10px;color:#e2e8f0;font-weight:700;">' + sys.name + '</td>'
      + '<td style="padding:10px;color:#94a3b8;">' + sys.vms + '</td>'
      + '<td style="padding:10px;color:#94a3b8;max-width:160px;">' + (sys.data||'').replace(/,/g,', ') + '</td>'
      + '<td style="padding:10px;"><span style="color:' + sensCol + ';font-weight:700;font-size:10px;">' + (sys.sensitivity||'low').toUpperCase() + '</span></td>'
      + '<td style="padding:10px;"><span style="color:' + scoreCol + ';font-weight:800;font-size:14px;">' + score + '%</span></td>'
      + '<td style="padding:10px;color:#a78bfa;font-size:10px;font-weight:700;">' + rec.service + '</td>'
      + '<td style="padding:10px;color:#fbbf24;font-weight:700;">$' + (sys.vms * 18) + 'K/yr</td>'
      + '<td style="padding:10px;">'
        + '<button onclick="selectAISystem(' + JSON.stringify(sys).replace(/"/g,'&quot;') + ');recommendAIPath();" style="background:rgba(109,40,217,.3);border:1px solid rgba(139,92,246,.5);border-radius:4px;color:#a78bfa;padding:3px 8px;font-size:9px;font-weight:700;cursor:pointer;margin-right:3px;">Assess</button>'
        + '<button onclick="selectAISystem(' + JSON.stringify(sys).replace(/"/g,'&quot;') + ');generateAILaunchPadPlan();" style="background:rgba(5,150,105,.3);border:1px solid rgba(52,211,153,.4);border-radius:4px;color:#34d399;padding:3px 8px;font-size:9px;font-weight:700;cursor:pointer;">LaunchPad</button>'
      + '</td>';
    tbody.appendChild(tr);
  });
}

window.calculateAIReadiness = function(sys) {
  var base = 40;
  if (sys.data && sys.data.indexOf('documents') >= 0) base += 15;
  if (sys.data && sys.data.indexOf('database') >= 0) base += 10;
  if (sys.data && sys.data.indexOf('tickets') >= 0) base += 10;
  if (sys.data && sys.data.indexOf('APIs') >= 0) base += 10;
  if (sys.sensitivity === 'low') base += 10;
  if (sys.sensitivity === 'medium') base += 5;
  if (sys.migStatus === 'Migrated') base += 5;
  return Math.min(base, 100);
};

/* ─── GOVERNANCE CHECKLIST ────────────────────────────────────────────── */
function renderChecklist() {
  var el = document.getElementById('sai-checklist-grid');
  if (!el) return;
  el.innerHTML = '';
  SAI_GOV_ITEMS.forEach(function(item) {
    var checked = !!saiState.govChecks[item];
    var div = document.createElement('div');
    div.style.cssText = 'background:rgba(30,41,59,.6);border:1px solid ' + (checked ? 'rgba(52,211,153,.4)' : 'rgba(255,255,255,.06)') + ';border-radius:8px;padding:10px 12px;display:flex;align-items:center;gap:10px;cursor:pointer;transition:border-color .15s;';
    div.innerHTML = '<div style="width:18px;height:18px;border-radius:4px;border:2px solid ' + (checked ? '#34d399' : '#334155') + ';background:' + (checked ? '#059669' : 'transparent') + ';flex-shrink:0;display:flex;align-items:center;justify-content:center;">'
      + (checked ? '<span style="color:#fff;font-size:11px;font-weight:900;">✓</span>' : '') + '</div>'
      + '<span style="font-size:11px;color:' + (checked ? '#e2e8f0' : '#64748b') + ';font-weight:' + (checked ? '700' : '400') + ';">' + item + '</span>';
    div.onclick = function() {
      saiState.govChecks[item] = !saiState.govChecks[item];
      renderChecklist();
      updateGovernanceScore();
      saveStage9State();
    };
    el.appendChild(div);
  });
  updateGovernanceScore();
}

window.updateGovernanceScore = function() {
  var total = SAI_GOV_ITEMS.length;
  var done = Object.keys(saiState.govChecks).filter(function(k){ return saiState.govChecks[k]; }).length;
  var pct = Math.round((done / total) * 100);
  var scoreEl = document.getElementById('sai-gov-score');
  var labelEl = document.getElementById('sai-gov-label');
  if (scoreEl) scoreEl.textContent = pct + '%';
  var label, col;
  if (pct >= 85)      { label = 'ENTERPRISE AI READY'; col = '#a78bfa'; }
  else if (pct >= 70) { label = 'AI READY';            col = '#34d399'; }
  else if (pct >= 40) { label = 'LAUNCHPAD CANDIDATE'; col = '#fbbf24'; }
  else                { label = 'NOT READY';            col = '#f87171'; }
  if (scoreEl) scoreEl.style.color = col;
  if (labelEl) { labelEl.textContent = label; labelEl.style.color = col; }
};

/* ─── COUNTERS ────────────────────────────────────────────────────────── */
function updateCounters() {
  var systems = saiState.systems;
  var cnt = document.getElementById('sai-cnt-imported'); if (cnt) cnt.textContent = systems.length;
  var ready = systems.filter(function(s){ return calculateAIReadiness(s) >= 70; });
  var cr = document.getElementById('sai-cnt-ready'); if (cr) cr.textContent = ready.length;
  var qw = systems.filter(function(s){ return s.sensitivity === 'low' || s.sensitivity === 'medium'; });
  var cq = document.getElementById('sai-cnt-quickwin'); if (cq) cq.textContent = qw.length;
  var totalVal = systems.reduce(function(a,s){ return a + s.vms * 18; }, 0);
  var cu = document.getElementById('sai-cnt-upsell'); if (cu) cu.textContent = '$' + totalVal + 'K';
}

window.saveStage9State = function() {
  try {
    localStorage.setItem(SAI_KEY, JSON.stringify({
      systems: saiState.systems,
      selectedSystemId: saiState.selectedSystemId || saiSystemKey(saiState.selectedSystem),
      selectedGoal: saiState.selectedGoal,
      selectedData: saiState.selectedData,

      launchPadPlan: saiState.launchPadPlan
    }));

};

window.loadStage9State = function() {
  try {
    var raw = localStorage.getItem(SAI_KEY);
    if (!raw) return;
    var saved = JSON.parse(raw);
    if (saved.systems)            saiState.systems = saved.systems;
    if (saved.selectedSystemId)   saiState.selectedSystemId = saved.selectedSystemId;
    if (saved.selectedGoal)       saiState.selectedGoal = saved.selectedGoal;
    if (saved.selectedData)       saiState.selectedData = saved.selectedData;
    if (saved.selectedSensitivity) saiState.selectedSensitivity = saved.selectedSensitivity;
    if (saved.govChecks)          saiState.govChecks = saved.govChecks;
    if (saved.launchPadPlan)      saiState.launchPadPlan = saved.launchPadPlan;
  } catch(e) {}
};
