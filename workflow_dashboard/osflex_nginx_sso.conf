# ─────────────────────────────────────────────────────────────────────────────
# osflex dashboard behind Microsoft Entra ID single sign-on.
#
# Drop-in replacement for osflex_nginx.conf once oauth2-proxy is running.
# Until then keep using osflex_nginx.conf — this file requires oauth2-proxy on
# 127.0.0.1:4180 and will return 500 on every request without it.
#
#   browser ──TLS──▶ nginx :5002
#                      │  auth_request  ──▶ oauth2-proxy :4180 ──▶ Entra ID
#                      │                      (password + Authenticator MFA
#                      │                       happen HERE, at Microsoft)
#                      ▼
#                    Flask :5001   ← receives only X-Auth-Request-* headers
#                                    that this file set from the verified
#                                    subrequest. It never sees a credential.
#
# The app side is already built: _opencenter_lab_identity() in app.py trusts
# these headers when OPENCENTER_TRUST_SSO_HEADERS=1. See docs/SSO_MICROSOFT_ENTRA.md.
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 5002 ssl http2;
    server_name localhost 127.0.0.1;

    # Replace with a CA-issued certificate before this is reachable off-host.
    ssl_certificate     /etc/nginx/ssl/osflex.crt;
    ssl_certificate_key /etc/nginx/ssl/osflex.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 50M;

    # ── oauth2-proxy's own endpoints: /oauth2/start, /oauth2/callback,
    #    /oauth2/sign_out. These must stay unauthenticated or sign-in deadlocks.
    location /oauth2/ {
        proxy_pass       http://127.0.0.1:4180;
        proxy_set_header Host                    $host;
        proxy_set_header X-Real-IP               $remote_addr;
        proxy_set_header X-Scheme                $scheme;
        proxy_set_header X-Auth-Request-Redirect $request_uri;
    }

    # ── The auth subrequest. Body is dropped: nginx would otherwise forward the
    #    whole upload of a POST to the auth check as well as to the app.
    location = /oauth2/auth {
        internal;
        proxy_pass                    http://127.0.0.1:4180;
        proxy_set_header Host         $host;
        proxy_set_header X-Real-IP    $remote_addr;
        proxy_set_header X-Scheme     $scheme;
        proxy_set_header Content-Length "";
        proxy_pass_request_body       off;
    }

    # Relative redirect on purpose: oauth2-proxy rebuilds the absolute URL from
    # its own redirect_url, so this cannot be steered by a forged Host header.
    # ($escaped_request_uri is an ingress-nginx variable and does not exist in
    # stock nginx; oauth2-proxy validates `rd` against its own allowed hosts.)
    location @sso_signin {
        internal;
        return 302 /oauth2/start?rd=$request_uri;
    }

    # ── Health check stays open so the launcher's readiness probe still works
    #    without a session. Add any other unauthenticated path here.
    location = /healthz {
        proxy_pass       http://127.0.0.1:5001;
        proxy_set_header Host      $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        auth_request /oauth2/auth;
        error_page 401 = @sso_signin;

        # Capture identity from the *verified* subrequest response only.
        auth_request_set $ar_user   $upstream_http_x_auth_request_user;
        auth_request_set $ar_email  $upstream_http_x_auth_request_email;
        auth_request_set $ar_pref   $upstream_http_x_auth_request_preferred_username;
        auth_request_set $ar_groups $upstream_http_x_auth_request_groups;

        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;

        # Server-Sent Events: the monitoring and deploy-log streams need these.
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        proxy_set_header   Host      $host;
        proxy_set_header   X-Real-IP $remote_addr;

        # ── Identity forwarded to Flask. Set from $ar_* — never from the client.
        proxy_set_header X-Auth-Request-Email              $ar_email;
        proxy_set_header X-Auth-Request-User               $ar_user;
        proxy_set_header X-Auth-Request-Preferred-Username $ar_pref;
        proxy_set_header X-Auth-Request-Groups             $ar_groups;

        # ── CRITICAL: blank every *other* header app.py is willing to trust.
        #    nginx passes unknown client headers upstream verbatim, so without
        #    these lines a browser could send `X-SSO-User: ceo@rackspace.com`
        #    and be treated as that person. Keep this list in sync with
        #    OPENCENTER_SSO_HEADERS and the role/cohort reads in app.py
        #    (_opencenter_lab_identity, around line 149-227).
        proxy_set_header X-Forwarded-User               "";
        proxy_set_header X-SSO-User                     "";
        proxy_set_header X-Forwarded-Preferred-Username "";
        proxy_set_header X-SSO-Role                     "";
        proxy_set_header X-Forwarded-Groups             "";
        proxy_set_header X-Training-Cohort              "";
        proxy_set_header X-SSO-Cohort                   "";
    }
}
