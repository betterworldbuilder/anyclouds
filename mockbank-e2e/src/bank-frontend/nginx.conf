server {
    listen 80;
    server_name _;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    # In-cluster: proxy API calls to the bank-api Service (Kubernetes DNS)
    location /api/ {
        proxy_pass http://bank-api:8000/api/;
        proxy_set_header Host $host;
    }

    location /health {
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
