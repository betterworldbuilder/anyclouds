apiVersion: apps/v1
kind: Deployment
metadata:
  name: bank-api
  namespace: mockbank-prod
  labels: {app: bank-api, app.kubernetes.io/part-of: mockbank}
spec:
  replicas: 2
  selector:
    matchLabels: {app: bank-api}
  template:
    metadata:
      labels: {app: bank-api, app.kubernetes.io/part-of: mockbank}
    spec:
      containers:
        - name: bank-api
          image: mockbank/bank-api:2.0.0
          imagePullPolicy: Never   # image is side-loaded into Kind, no registry pull
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: bank-db-credentials, key: DATABASE_URL}
          ports: [{containerPort: 8000}]
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: bank-api
  namespace: mockbank-prod
  labels: {app: bank-api}
spec:
  selector: {app: bank-api}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
